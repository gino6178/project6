<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 322" width="1060" height="322" font-family="Helvetica,Arial,sans-serif"><style>.t{font-size:12.5px;fill:#1e2227}.s{font-size:11px;fill:#6b7280}.k{font-size:12px;font-weight:700;fill:#1e2227}.b{font-size:11.5px;font-weight:700;fill:#c0392b}.m{font-size:10.5px;fill:#6b7280;font-style:italic}</style><defs><marker id="p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#3f6d8c"/></marker></defs><text x="6.0" y="20.0" class="k" text-anchor="start">Elevate3D: two stages over one representation</text><rect x="6.0" y="40.0" width="190.0" height="112.0" rx="7" fill="#f4f2ee" stroke="#c8c3b8" stroke-width="1.4"/><text x="17.0" y="60.0" class="k" text-anchor="start">input</text><text x="17.0" y="79.0" class="s" text-anchor="start">room polygon P</text><text x="17.0" y="94.0" class="s" text-anchor="start">room type</text><text x="17.0" y="109.0" class="s" text-anchor="start">ceiling height</text><rect x="258.0" y="40.0" width="218.0" height="112.0" rx="7" fill="#f4f2ee" stroke="#3f6d8c" stroke-width="1.4"/><text x="269.0" y="60.0" class="b" text-anchor="start">M1  FieldNet  (3.5 M)</text><text x="269.0" y="79.0" class="s" text-anchor="start">program, 1 of 4</text><text x="269.0" y="94.0" class="s" text-anchor="start">12 support offsets h(u)</text><text x="269.0" y="109.0" class="s" text-anchor="start">rise Δh</text><text x="269.0" y="124.0" class="s" text-anchor="start">→ tiers, transitions</text><rect x="538.0" y="40.0" width="238.0" height="112.0" rx="7" fill="#f4f2ee" stroke="#3f6d8c" stroke-width="1.4"/><text x="549.0" y="60.0" class="b" text-anchor="start">M2  Elevate3D  (27.8 M)</text><text x="549.0" y="79.0" class="s" text-anchor="start">autoregressive over objects</text><text x="549.0" y="94.0" class="s" text-anchor="start">tier-biased attention</text><text x="549.0" y="109.0" class="s" text-anchor="start">mixture heads: x, y, yaw, size</text><text x="549.0" y="124.0" class="s" text-anchor="start">support pointer, not z</text><rect x="838.0" y="40.0" width="216.0" height="112.0" rx="7" fill="#f4f2ee" stroke="#c8c3b8" stroke-width="1.4"/><text x="849.0" y="60.0" class="k" text-anchor="start">resolve</text><text x="849.0" y="79.0" class="s" text-anchor="start">z<tspan baseline-shift="-24%" font-size="8.5">i</tspan> = top(π(i)) + Δz<tspan baseline-shift="-24%" font-size="8.5">i</tspan></text><text x="849.0" y="94.0" class="s" text-anchor="start">one pass over the support tree</text><text x="849.0" y="109.0" class="s" text-anchor="start">L_contact ≡ 0, by construction</text><path d="M196,96.0 L256,96.0" stroke="#3f6d8c" stroke-width="1.6" marker-end="url(#p)"/><text x="226.0" y="88.0" class="m" text-anchor="middle">P, type</text><path d="M476,96.0 L536,96.0" stroke="#3f6d8c" stroke-width="1.6" marker-end="url(#p)"/><text x="506.0" y="88.0" class="m" text-anchor="middle">field S</text><path d="M776,96.0 L836,96.0" stroke="#3f6d8c" stroke-width="1.6" marker-end="url(#p)"/><text x="806.0" y="88.0" class="m" text-anchor="middle">π(i), Δz<tspan baseline-shift="-24%" font-size="8.5">i</tspan></text><text x="6.0" y="170.0" class="s" text-anchor="start">S = (P, {(R<tspan baseline-shift="-24%" font-size="8.5">k</tspan>, h<tspan baseline-shift="-24%" font-size="8.5">k</tspan>)}<tspan baseline-shift="-24%" font-size="8.5">k=1..K</tspan>, T)   —   a piecewise-constant floor: K convex regions, their heights, and the transitions between them. K = 1 is the flat floor every current method assumes.</text><path d="M6,196 L1054,196" stroke="#c8c3b8" stroke-width="1"/><text x="6.0" y="216.0" class="k" text-anchor="start">why a support pointer and not a height</text><text x="6.0" y="236.0" class="s" text-anchor="start">Regressing z makes contact a soft penalty. The loss is smallest</text><text x="6.0" y="251.0" class="s" text-anchor="start">near the mean of the tier heights, so an object that could go on</text><text x="6.0" y="266.0" class="s" text-anchor="start">either of two tiers lands between them, touching neither.</text><text x="6.0" y="281.0" class="s" text-anchor="start">Pointing at a support makes contact exact and unlearnable-away.</text><rect x="470.0" y="250.0" width="150.0" height="20.0" rx="0" fill="#d9d2c4" stroke="#b9ae99" stroke-width="1.2"/><text x="545.0" y="264.0" class="m" text-anchor="middle">datum   h = 0</text><rect x="620.0" y="232.0" width="130.0" height="38.0" rx="0" fill="#a8c3d4" stroke="#6f93a8" stroke-width="1.2"/><text x="685.0" y="254.0" class="m" text-anchor="middle">tier 1   h = +0.42</text><rect x="648.0" y="200.0" width="74.0" height="32.0" rx="0" fill="#8a6f4e" stroke="#5d4a33" stroke-width="1.4"/><text x="685.0" y="194.0" class="m" text-anchor="middle">π(sofa) = tier 1</text><text x="610.0" y="290.0" class="m" text-anchor="middle">z is read off the support, never predicted</text><text x="790.0" y="236.0" class="b" text-anchor="start">Three consequences the tables measure:</text><text x="790.0" y="254.0" class="s" text-anchor="start">•  contact violations cannot occur at all</text><text x="790.0" y="269.0" class="s" text-anchor="start">•  the model spends no capacity on z</text><text x="790.0" y="284.0" class="s" text-anchor="start">•  K = 1 degenerates to the flat setting,</text><text x="790.0" y="299.0" class="s" text-anchor="start">    so the formalism is a strict superset</text></svg>